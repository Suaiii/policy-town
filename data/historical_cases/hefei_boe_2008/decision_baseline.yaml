availability_note: >-
  框架协议于2008-09-13公开。真实回放基线可以读取协议动作；未来盲推演的
  Context 在2008-09-12截止，不得读取该协议及其动作、金额和条件。

government_action:
  action: invest
  agreement_type: investment_framework
  components:
    - sign_framework_agreement
    - establish_project_company
    - commit_registered_capital
    - arrange_syndicated_loan
    - provide_industrial_support
  project_total_investment:
    value: 175
    unit: 亿元
  project_capital:
    value: 90
    unit: 亿元
  government_registered_capital_commitment:
    value: 60
    unit: 亿元
  initial_registered_capital:
    value: 0.5
    unit: 亿元
  initial_government_cash_commitment:
    value: 0.405
    unit: 亿元
  initial_government_equity_share:
    value: 81
    unit: '%'
  annual_interest_subsidy:
    value: 1.5
    unit: 亿元/年
  interest_subsidy_years: 3
  source_ids:
    - src_boe_hefei_6g_framework_2008

conditions:
  - condition_id: project_company_within_45_days
    category: company_setup
    description: 协议签署后45日内完成项目公司工商注册，否则协议自动终止。
    source_ids: [src_boe_hefei_6g_framework_2008]
  - condition_id: government_capital_responsibility
    category: capital
    description: 政府方或其指定平台承担60亿元项目公司注册资本投入。
    source_ids: [src_boe_hefei_6g_framework_2008]
  - condition_id: external_capital_raise
    category: capital
    description: 其余30亿元资本金由双方通过资本市场或战略投资者筹集，不足部分由政府方负责落实。
    source_ids: [src_boe_hefei_6g_framework_2008]
  - condition_id: syndicated_loan
    category: financing
    description: 总投资与项目资本金的差额由双方共同落实银团贷款。
    source_ids: [src_boe_hefei_6g_framework_2008]
  - condition_id: loan_guarantee_if_required
    category: guarantee
    description: 银团提出担保要求时，双方按银团要求提供担保。
    source_ids: [src_boe_hefei_6g_framework_2008]
  - condition_id: three_year_interest_subsidy
    category: subsidy
    description: 政府方为项目公司银行贷款提供3年、每年1.5亿元的贷款贴息。
    source_ids: [src_boe_hefei_6g_framework_2008]
  - condition_id: land_energy_infrastructure_support
    category: industrial_support
    description: 政府方提供地块开发、土地价格、能源、基础设施和信息等支持。
    source_ids: [src_boe_hefei_6g_framework_2008]
  - condition_id: construction_deadline
    category: construction
    description: 建设开工目标不晚于2009-03-31。
    source_ids: [src_boe_hefei_6g_framework_2008]
  - condition_id: production_deadline
    category: production
    description: 投产目标为2010年第四季度末。
    source_ids: [src_boe_hefei_6g_framework_2008]

