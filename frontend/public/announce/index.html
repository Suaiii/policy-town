<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江东省人民政府 · 公告发布模拟</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpolygon points='12,2 14.7,8.6 21.7,9.1 16.2,13.5 17.9,20.2 12,16.4 6.1,20.2 7.8,13.5 2.3,9.1 9.3,8.6' fill='%23d61f26'/%3E%3C/svg%3E">
<style>
  :root {
    --gov-red: #d61f26;
    --gov-red-dark: #a5121a;
    --bg-deep: #0c0f14;
    --ink: #1a1a1a;
    --serif: SimSun, "宋体", "Songti SC", "Noto Serif CJK SC", serif;
    --mono: "SF Mono", Menlo, Consolas, "Courier New", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse at 50% 30%, rgba(214,31,38,0.06), transparent 60%),
      radial-gradient(ellipse at 50% 110%, rgba(30,50,90,0.25), transparent 70%),
      var(--bg-deep);
    color: #cfd6e1;
    font-family: var(--serif);
    overflow: hidden;
    user-select: none;
  }
  body.shake { animation: shake 0.35s linear; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-5px,3px); }
    40% { transform: translate(4px,-4px); }
    60% { transform: translate(-3px,-2px); }
    80% { transform: translate(3px,2px); }
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 28px; z-index: 30; pointer-events: none;
  }
  .topbar .brand {
    font-size: 13px; letter-spacing: 4px; color: #8b95a7;
    display: flex; align-items: center; gap: 10px;
  }
  .topbar .brand svg { width: 16px; height: 16px; }
  .mute {
    pointer-events: auto; cursor: pointer;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid #2a3242; background: rgba(20,25,34,0.8);
    display: flex; align-items: center; justify-content: center;
    transition: border-color .2s;
  }
  .mute:hover { border-color: var(--gov-red); }
  .mute svg { width: 18px; height: 18px; fill: none; stroke: #8b95a7; stroke-width: 1.6; }
  .mute.muted svg .wave { display: none; }
  .mute.muted svg .slash { display: inline; }
  .mute svg .slash { display: none; stroke: var(--gov-red); }

  /* ---------- 主舞台（1280x800 设计稿，JS 缩放适配） ---------- */
  #viewport {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center; z-index: 10;
  }
  #stage {
    width: 1280px; height: 800px; position: relative;
    flex: 0 0 auto; transform-origin: center center;
    perspective: 1600px;
  }

  /* ---------- 第 1 幕：输入面板 ---------- */
  .panel {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 620px; text-align: center;
    transition: opacity .4s;
  }
  .panel.hidden { opacity: 0; pointer-events: none; }
  .panel .emblem-line {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 26px;
  }
  .panel .emblem-line::before, .panel .emblem-line::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(214,31,38,0.7));
  }
  .panel .emblem-line::after {
    background: linear-gradient(90deg, rgba(214,31,38,0.7), transparent);
  }
  .panel .emblem-line svg { width: 30px; height: 30px; }
  .panel h1 {
    font-size: 30px; letter-spacing: 10px; color: #e8ecf3;
    font-weight: 700; margin-bottom: 8px;
  }
  .panel .sub {
    font-size: 13px; letter-spacing: 3px; color: #6b7586; margin-bottom: 36px;
  }
  .input-box {
    position: relative;
    border: 1px solid #2a3242;
    background: rgba(20,25,34,0.85);
    border-radius: 4px;
    padding: 2px;
    transition: border-color .25s, box-shadow .25s;
  }
  .input-box:focus-within {
    border-color: var(--gov-red);
    box-shadow: 0 0 0 1px rgba(214,31,38,0.4), 0 0 30px rgba(214,31,38,0.12);
  }
  .input-box .corner {
    position: absolute; width: 14px; height: 14px;
    border: 1px solid var(--gov-red); pointer-events: none;
  }
  .corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .input-box textarea {
    width: 100%; height: 96px; resize: none;
    background: transparent; border: none; outline: none;
    color: #e8ecf3; font-family: var(--serif); font-size: 16px;
    line-height: 1.7; padding: 16px 18px; letter-spacing: 1px;
  }
  .input-box textarea::placeholder { color: #4d5665; }
  .btn-activate {
    margin-top: 26px;
    display: inline-flex; align-items: center; gap: 10px;
    background: linear-gradient(180deg, var(--gov-red), var(--gov-red-dark));
    color: #fff; border: none; cursor: pointer;
    font-family: var(--serif); font-size: 17px; font-weight: 700;
    letter-spacing: 6px; padding: 14px 52px 14px 58px;
    border-radius: 3px;
    box-shadow: 0 4px 18px rgba(214,31,38,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform .15s, box-shadow .2s, filter .2s;
  }
  .btn-activate:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-activate:active { transform: translateY(1px); }
  .btn-activate svg { width: 16px; height: 16px; }
  .btn-activate:disabled { filter: grayscale(.6); cursor: not-allowed; }
  .config-tip {
    margin-top: 18px; font-size: 12px; letter-spacing: 1px;
    color: #c9a227; display: none;
  }
  .config-tip.show { display: block; }

  /* 吸入动画：输入文字收缩淡出至屏幕中心 */
  .suck-in {
    transition: transform .45s cubic-bezier(.5,0,.8,.4), opacity .45s;
    transform: translate(-50%, -50%) scale(0.02) !important;
    opacity: 0 !important;
  }

  /* 飞出的五角星 */
  .fly-star {
    position: absolute; z-index: 40; pointer-events: none;
    transition: transform .5s cubic-bezier(.3,.7,.4,1), opacity .5s;
  }

  /* 签发标识：旋转五角星 + 签发中 */
  .badge {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 35; text-align: center;
    transition: transform .45s cubic-bezier(.2,1.4,.4,1), opacity .3s;
    opacity: 0;
  }
  .badge.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .badge svg { width: 84px; height: 84px; animation: spin 3.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .badge .txt {
    margin-top: 14px; font-size: 18px; letter-spacing: 8px;
    color: #e8ecf3; font-weight: 700;
  }
  .badge .txt::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "·"; } 50% { content: "··"; } 75% { content: "···"; } }

  /* ---------- 第 2/3 幕：斜置纸面 + 打字机逐字成文 ---------- */
  .paper {
    position: absolute; left: 50%; top: 50%;
    width: 680px; min-height: 620px; max-height: 740px;
    /* 初始：深度倾斜藏于远处 */
    transform: translate(-50%, -50%) rotateX(58deg) rotateY(-42deg) rotateZ(10deg) scale(0.5);
    transform-style: preserve-3d;
    opacity: 0; z-index: 20;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.012) 0 2px, transparent 2px 4px),
      radial-gradient(ellipse at 30% 20%, rgba(0,0,0,0.02), transparent 60%),
      #fbfaf6;
    border-radius: 6px;
    box-shadow: -50px 60px 100px rgba(0,0,0,0.65), -8px 10px 24px rgba(0,0,0,0.45);
    padding: 44px 56px 40px;
    color: var(--ink);
    overflow: hidden;
    pointer-events: none;
    transition: transform .9s cubic-bezier(.25,.9,.3,1), opacity .45s;
  }
  /* 视觉欺幻：斜着看这张文件 */
  .paper.reveal {
    opacity: 1;
    transform: translate(-50%, -50%) rotateX(21deg) rotateY(-27deg) rotateZ(3deg) scale(0.92);
  }
  /* 成文后转正定格 */
  .paper.flat {
    transform: translate(-50%, -50%) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 4px 16px rgba(0,0,0,0.4);
    transition: transform 1.1s cubic-bezier(.25,.8,.25,1), box-shadow 1.1s;
  }

  /* 打字光标（颜色随所在文字） */
  .caret {
    display: inline-block; width: 2px; height: 1em;
    background: currentColor; vertical-align: -0.12em; margin-left: 1px;
    animation: blink .55s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .doc-redhead {
    color: var(--gov-red); font-weight: 700;
    font-size: 38px; letter-spacing: 4px; text-align: center;
    font-family: var(--serif);
    min-height: 52px; white-space: nowrap;
  }
  .doc-number {
    text-align: center; font-size: 15px; letter-spacing: 2px;
    margin-top: 6px; opacity: 0; transition: opacity .4s;
    font-family: var(--serif); color: #333;
  }
  .doc-number.show { opacity: 1; }
  .doc-rule {
    height: 3px; background: var(--gov-red);
    width: 0; margin: 14px auto 0;
    transition: width .5s cubic-bezier(.3,.8,.3,1);
  }
  .doc-rule.draw { width: 100%; }
  .doc-title {
    text-align: center; font-size: 22px; font-weight: 700;
    margin: 26px 0 22px; line-height: 1.5; letter-spacing: 1px;
    min-height: 33px;
  }
  .doc-to {
    font-size: 15px; line-height: 1.8; letter-spacing: 1px;
    min-height: 27px;
  }
  .doc-body p {
    font-size: 15px; line-height: 1.8; letter-spacing: 1px;
    text-indent: 2em; margin-top: 4px;
  }
  .doc-sign {
    margin-top: 26px; text-align: right; font-size: 16px;
    line-height: 2.0; letter-spacing: 2px; padding-right: 24px;
    min-height: 64px;
  }

  /* ---------- 第 4 幕：公章 ---------- */
  .seal {
    position: absolute; right: 30px; bottom: 30px;
    width: 168px; height: 168px; z-index: 25;
    opacity: 0; pointer-events: none;
    transform: translateY(-260px) scale(2.4) rotate(-14deg);
    mix-blend-mode: multiply;
  }
  .seal.stamp {
    transition: transform .22s cubic-bezier(.5,0,.7,1), opacity .12s;
    opacity: 1;
    transform: translateY(0) scale(1) rotate(-8deg);
  }
  .seal.bounce {
    transition: transform .28s cubic-bezier(.2,1.6,.4,1);
    transform: translateY(-4px) scale(1.02) rotate(-8deg);
  }
  .seal.settled {
    transition: transform .2s;
    transform: translateY(0) scale(1) rotate(-8deg);
  }

  /* ---------- 失败分支：不予签发 ---------- */
  .fail-layer {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 26; text-align: center; display: none;
  }
  .fail-layer.show { display: block; }
  .fail-stamp {
    display: inline-block;
    border: 5px solid var(--gov-red); border-radius: 10px;
    color: var(--gov-red); font-size: 44px; font-weight: 700;
    letter-spacing: 12px; padding: 14px 26px 14px 38px;
    transform: rotate(-12deg) scale(3); opacity: 0;
    mix-blend-mode: multiply;
    font-family: var(--serif);
    background: rgba(214,31,38,0.04);
  }
  .fail-stamp.stamp {
    transition: transform .22s cubic-bezier(.5,0,.7,1), opacity .12s;
    transform: rotate(-12deg) scale(1); opacity: 1;
  }
  .fail-msg {
    margin-top: 34px; font-size: 16px; letter-spacing: 2px;
    color: #aab4c4; opacity: 0; transition: opacity .4s .2s;
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
  }
  .fail-layer.show .fail-msg { opacity: 1; }

  /* ---------- 再发布一次 ---------- */
  .btn-again {
    position: absolute; left: 50%; bottom: 26px;
    transform: translateX(-50%);
    z-index: 28; display: none;
    background: transparent; color: #cfd6e1;
    border: 1px solid #3a4356; border-radius: 3px;
    font-family: var(--serif); font-size: 14px; letter-spacing: 4px;
    padding: 10px 34px; cursor: pointer;
    transition: border-color .2s, color .2s, background .2s;
  }
  .btn-again:hover {
    border-color: var(--gov-red); color: #fff;
    background: rgba(214,31,38,0.12);
  }
  .btn-again.show { display: block; animation: fadeup .4s; }
  @keyframes fadeup { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24"><polygon points="12,2 14.7,8.6 21.7,9.1 16.2,13.5 17.9,20.2 12,16.4 6.1,20.2 7.8,13.5 2.3,9.1 9.3,8.6" fill="none" stroke="#d61f26" stroke-width="1.4"/></svg>
    江东省人民政府 · 公告发布模拟
  </div>
  <div class="mute" id="muteBtn" title="静音开关">
    <svg viewBox="0 0 24 24">
      <path d="M4 9v6h4l5 4V5L8 9H4z"/>
      <path class="wave" d="M16 9c1.5 1.5 1.5 4.5 0 6"/>
      <path class="wave" d="M18.5 6.5c3 3 3 8 0 11"/>
      <line class="slash" x1="3" y1="3" x2="21" y2="21"/>
    </svg>
  </div>
</div>

<div id="viewport">
  <div id="stage">

    <!-- 第 1 幕：输入面板 -->
    <div class="panel" id="panel">
      <div class="emblem-line">
        <svg viewBox="0 0 24 24"><polygon points="12,2 14.7,8.6 21.7,9.1 16.2,13.5 17.9,20.2 12,16.4 6.1,20.2 7.8,13.5 2.3,9.1 9.3,8.6" fill="none" stroke="#d61f26" stroke-width="1.2"/></svg>
      </div>
      <h1>公告发布模拟</h1>
      <div class="sub">输入一个主题，即刻以领导口吻拟就并签发一份正式公告</div>
      <div class="input-box">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <textarea id="input" maxlength="500" placeholder="例如：开展全市全民阅读活动……"></textarea>
      </div>
      <button class="btn-activate" id="activateBtn">
        <svg viewBox="0 0 24 24"><polygon points="12,2 14.7,8.6 21.7,9.1 16.2,13.5 17.9,20.2 12,16.4 6.1,20.2 7.8,13.5 2.3,9.1 9.3,8.6" fill="#fff"/></svg>
        发布公告
      </button>
      <div class="config-tip" id="configTip"></div>
    </div>

    <!-- 签发标识 -->
    <div class="badge" id="badge">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="none" stroke="#d61f26" stroke-width="1.5" stroke-dasharray="6 4"/>
        <polygon points="50,18 58.4,40.4 82,41 63.4,56.2 70.2,79 50,65 29.8,79 36.6,56.2 18,41 41.6,40.4" fill="none" stroke="#d61f26" stroke-width="2"/>
      </svg>
      <div class="txt">签发中</div>
    </div>

    <!-- 第 2/3 幕：斜置纸面 + 打字成文 -->
    <div class="paper" id="paper">
      <div class="doc-redhead" id="docRedhead"></div>
      <div class="doc-number" id="docNumber"></div>
      <div class="doc-rule" id="docRule"></div>
      <div class="doc-title" id="docTitle"></div>
      <div class="doc-to" id="docTo"></div>
      <div class="doc-body" id="docBody"></div>
      <div class="doc-sign" id="docSign"></div>
      <svg class="seal" id="seal" viewBox="0 0 200 200">
        <defs>
          <path id="sealArc" d="M 100,100 m -72,0 a 72,72 0 1,1 144,0 a 72,72 0 1,1 -144,0" />
        </defs>
        <circle cx="100" cy="100" r="94" fill="none" stroke="#d61f26" stroke-width="5" opacity="0.9"/>
        <polygon points="100,58 110.5,88.5 142.6,88.9 116.9,108.4 126.2,139.1 100,120.5 73.8,139.1 83.1,108.4 57.4,88.9 89.5,88.5"
                 fill="#d61f26" opacity="0.9"/>
        <text font-family="SimSun, 宋体, serif" font-size="21.5" font-weight="700" fill="#d61f26" opacity="0.9" letter-spacing="3">
          <textPath href="#sealArc" startOffset="6.5%">江东省人民政府</textPath>
        </text>
      </svg>
    </div>

    <!-- 失败分支 -->
    <div class="fail-layer" id="failLayer">
      <div class="fail-stamp" id="failStamp">不予签发</div>
      <div class="fail-msg" id="failMsg">经研究，本次公告未获签发，请重新提交。</div>
    </div>

    <button class="btn-again" id="againBtn">再发布一次</button>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
 * 江东省人民政府 · 公告发布模拟
 * 原生 JS，零依赖；动效 = requestAnimationFrame + CSS transitions
 * ===================================================================== */

const $ = (id) => document.getElementById(id);
const stage = $('stage');

/* ---------- 1280x800 设计稿缩放适配 ---------- */
function fitStage() {
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 800, 1);
  stage.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fitStage);
fitStage();

/* =====================================================================
 * 音效引擎：Web Audio API 实时合成（无音频文件）
 * ===================================================================== */
const AudioFX = (() => {
  let ctx = null;
  let master = null;
  let muted = false;

  function ensure() {
    if (ctx) return true;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.9;
      master.connect(ctx.destination);
      return true;
    } catch (e) { return false; }
  }
  function noiseBuffer(seconds) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }
  return {
    unlock() { if (ensure() && ctx.state === 'suspended') ctx.resume(); },
    setMuted(m) {
      muted = m;
      if (ensure()) master.gain.setTargetAtTime(m ? 0 : 0.9, ctx.currentTime, 0.02);
    },
    /* 清脆“咔哒” */
    click() {
      if (!ensure()) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'square'; osc.frequency.value = 2200;
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      osc.connect(g).connect(master); osc.start(t); osc.stop(t + 0.06);
      const src = ctx.createBufferSource();
      src.buffer = noiseBuffer(0.04);
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.25, t);
      ng.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;
      src.connect(hp).connect(ng).connect(master); src.start(t);
    },
    /* 打字机击键：短促噪声 + 轻微音高随机 */
    typeKey() {
      if (!ensure()) return;
      const t = ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = noiseBuffer(0.03);
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 2400 + Math.random() * 1400;
      bp.Q.value = 1.4;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.07 + Math.random() * 0.04, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
      src.connect(bp).connect(g).connect(master); src.start(t);
      const osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.value = 1500 + Math.random() * 700;
      const og = ctx.createGain();
      og.gain.setValueAtTime(0.025, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
      osc.connect(og).connect(master); osc.start(t); osc.stop(t + 0.025);
    },
    /* 换行“叮” */
    ding() {
      if (!ensure()) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = 1568;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      osc.connect(g).connect(master); osc.start(t); osc.stop(t + 0.42);
    },
    /* 纸张“唰” */
    swish() {
      if (!ensure()) return;
      const t = ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = noiseBuffer(0.5);
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(500, t);
      bp.frequency.exponentialRampToValueAtTime(4500, t + 0.4);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      src.connect(bp).connect(g).connect(master); src.start(t); src.stop(t + 0.5);
    },
    /* 盖章“砰” */
    thud() {
      if (!ensure()) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(120, t);
      osc.frequency.exponentialRampToValueAtTime(45, t + 0.25);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.6, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.connect(g).connect(master); osc.start(t); osc.stop(t + 0.32);
      const src = ctx.createBufferSource();
      src.buffer = noiseBuffer(0.12);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.4, t);
      ng.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      src.connect(lp).connect(ng).connect(master); src.start(t);
    },
  };
})();

$('muteBtn').addEventListener('click', () => {
  const btn = $('muteBtn');
  const m = !btn.classList.contains('muted');
  btn.classList.toggle('muted', m);
  AudioFX.unlock();
  AudioFX.setMuted(m);
});

/* =====================================================================
 * 流程编排：激活 → 斜置纸面打字成文 → 转正盖章 → 失败分支
 * ===================================================================== */
const panel = $('panel');
const badge = $('badge');
const paper = $('paper');
const againBtn = $('againBtn');
const input = $('input');
const activateBtn = $('activateBtn');

let busy = false;

/* ---------- 工具 ---------- */
function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

/* 当天日期转汉字大写：二〇二六年八月十二日 */
function chineseDate(d) {
  const digits = '〇一二三四五六七八九';
  const y = String(d.getFullYear()).split('').map((c) => digits[+c]).join('');
  const m = d.getMonth() + 1, day = d.getDate();
  const mn = m <= 10 ? (m === 10 ? '十' : digits[m]) : '十' + digits[m % 10];
  let dn;
  if (day <= 10) dn = day === 10 ? '十' : digits[day];
  else if (day < 20) dn = '十' + digits[day % 10];
  else if (day % 10 === 0) dn = digits[day / 10] + '十';
  else dn = digits[(day / 10) | 0] + '十' + digits[day % 10];
  return `${y}年${mn}月${dn}日`;
}

/* 文号：江政发〔2026〕XX号 */
function docNumber() {
  const year = new Date().getFullYear();
  const no = 1 + Math.floor(Math.random() * 98);
  return `江政发〔${year}〕${no}号`;
}

/* 打字机：逐字打入，带击键音与节奏抖动 */
async function typeInto(el, text, delay, onKey) {
  const caret = document.createElement('span');
  caret.className = 'caret';
  el.appendChild(caret);
  const sound = onKey || (() => AudioFX.typeKey());
  for (const ch of text) {
    el.insertBefore(document.createTextNode(ch), caret);
    sound();
    await wait(delay + Math.random() * Math.min(delay * 0.5, 4));
  }
  caret.remove();
}

/* ---------- API 基址：由父页面通过 ?api= 传入（Convex Site URL），缺省走同源 ---------- */
const API_BASE = (new URLSearchParams(location.search).get('api') || '').replace(/\/+$/, '');

/* ---------- 页面加载：检查 API Key 配置，未配置给明确提示 ---------- */
fetch(`${API_BASE}/api/health`).then((r) => r.json()).then((h) => {
  if (!h.configured) {
    const tip = $('configTip');
    tip.textContent = '提示：服务端尚未配置 DEEPSEEK_API_KEY（请在项目根目录执行 npx convex env set DEEPSEEK_API_KEY sk-xxx 并重新部署），当前点击将无法完成签发。';
    tip.classList.add('show');
  }
}).catch(() => { /* 静态打开等场景下忽略 */ });

/* ---------- API 调用（30s 超时兜底） ---------- */
async function generate(text) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 30000);
  try {
    const resp = await fetch(`${API_BASE}/api/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
      signal: controller.signal,
    });
    const json = await resp.json().catch(() => null);
    if (!json) return { ok: false, message: '服务响应异常，请重新提交。' };
    if (!json.ok) return { ok: false, message: json.message || '本次公告未获签发，请重新提交。' };
    return { ok: true, data: json.data };
  } catch (e) {
    return { ok: false, message: e.name === 'AbortError' ? '拟稿超时，请重新提交。' : '网络异常，请重新提交。' };
  } finally {
    clearTimeout(timer);
  }
}

/* ---------- 第 1 幕：激活 ---------- */
async function act1() {
  AudioFX.unlock();
  AudioFX.click();

  // 红色五角星从按钮位置飞出
  const btnRect = activateBtn.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 800, 1);
  const star = document.createElement('div');
  star.className = 'fly-star';
  star.innerHTML = '<svg viewBox="0 0 24 24" width="26" height="26"><polygon points="12,2 14.7,8.6 21.7,9.1 16.2,13.5 17.9,20.2 12,16.4 6.1,20.2 7.8,13.5 2.3,9.1 9.3,8.6" fill="#d61f26"/></svg>';
  const sx = (btnRect.left + btnRect.width / 2 - stageRect.left) / scale - 13;
  const sy = (btnRect.top + btnRect.height / 2 - stageRect.top) / scale - 13;
  star.style.left = sx + 'px';
  star.style.top = sy + 'px';
  stage.appendChild(star);

  // 输入面板文字“吸入”屏幕中央
  panel.classList.add('suck-in');

  const dx = 640 - sx - 13, dy = 400 - sy - 13;
  requestAnimationFrame(() => {
    star.style.transform = `translate(${dx}px, ${dy}px) rotate(540deg) scale(2.2)`;
    star.style.opacity = '0';
  });
  await wait(480);
  star.remove();
  panel.classList.add('hidden');
  panel.classList.remove('suck-in');
  badge.classList.add('show');
}

/* ---------- 第 2 幕：斜置纸面浮现，红头逐字打入（与 API 请求并行） ---------- */
async function actIntro() {
  await wait(500);
  badge.classList.remove('show');
  AudioFX.swish();
  paper.classList.add('reveal');          // 视觉欺幻：斜着看这张文件
  await wait(950);

  // 红头逐字打入（打字机）
  await typeInto($('docRedhead'), '江东省人民政府文件', 85);
  await wait(200);

  // 文号 + 红线描出
  $('docNumber').textContent = docNumber();
  $('docNumber').classList.add('show');
  await wait(150);
  $('docRule').classList.add('draw');
  await wait(450);

  // 等待 API 期间：标题位置放一个闪烁光标，模拟打印机待命
  $('docTitle').appendChild(Object.assign(document.createElement('span'), { className: 'caret', id: 'waitCaret' }));
}

/* ---------- 第 3 幕：标题、主送、正文、落款逐字打入（全程 3-5s 自适应） ---------- */
async function actType(doc) {
  $('waitCaret')?.remove();
  AudioFX.ding();

  const toText = '各市、县人民政府，省政府各部门、各直属机构：';
  const signText = '江东省人民政府' + chineseDate(new Date());
  const totalChars = doc.title.length + toText.length + signText.length +
    doc.paragraphs.reduce((n, p) => n + p.length, 0);
  // 打字总预算 ~2.6s，按字数均摊；含段间停顿与抖动，合计约 3.5-4.5s
  const delay = Math.max(4, Math.min(24, 2600 / Math.max(totalChars, 1)));
  // 击键音节流：间隔太密时每隔几字响一次，保持约 60-70 次/秒以内
  const soundEvery = Math.max(1, Math.ceil(15 / delay));
  let tick = 0;
  const key = () => { if (tick++ % soundEvery === 0) AudioFX.typeKey(); };

  await typeInto($('docTitle'), doc.title, delay, key);
  await wait(120);

  await typeInto($('docTo'), toText, delay, key);
  await wait(100);

  const body = $('docBody');
  for (const text of doc.paragraphs) {
    const p = document.createElement('p');
    body.appendChild(p);
    await typeInto(p, text, delay, key);
    AudioFX.ding();
    await wait(100);
  }
  await wait(150);

  const sign = $('docSign');
  const caret = document.createElement('span');
  caret.className = 'caret';
  sign.appendChild(caret);
  for (const ch of '江东省人民政府') {
    sign.insertBefore(document.createTextNode(ch), caret);
    key();
    await wait(delay);
  }
  sign.insertBefore(document.createElement('br'), caret);
  for (const ch of chineseDate(new Date())) {
    sign.insertBefore(document.createTextNode(ch), caret);
    key();
    await wait(delay);
  }
  caret.remove();
  await wait(250);
}

/* ---------- 第 4 幕：纸面转正，盖章定格 ---------- */
async function actSeal() {
  paper.classList.add('flat');            // 斜置 → 正对观众
  await wait(1100);

  const seal = $('seal');
  seal.classList.add('stamp');
  await wait(230);
  AudioFX.thud();
  document.body.classList.add('shake');
  seal.classList.add('bounce');
  await wait(280);
  seal.classList.remove('bounce');
  seal.classList.add('settled');
  document.body.classList.remove('shake');
  await wait(300);
  againBtn.classList.add('show');
}

/* ---------- 失败分支：不予签发 ---------- */
async function actFail(message) {
  badge.classList.remove('show');
  $('waitCaret')?.remove();
  $('failMsg').textContent = message || '经研究，本次公告未获签发，请重新提交。';
  $('failLayer').classList.add('show');
  await wait(60);
  $('failStamp').classList.add('stamp');
  await wait(230);
  AudioFX.thud();
  document.body.classList.add('shake');
  await wait(360);
  document.body.classList.remove('shake');
  againBtn.classList.add('show');
}

/* ---------- 主流程 ---------- */
async function run() {
  const text = input.value.trim();
  if (!text) {
    input.focus();
    return;
  }
  if (busy) return;
  busy = true;
  activateBtn.disabled = true;
  try {
    await act1();                                // 第 1 幕 ~0.5s
    const genPromise = generate(text);           // 真实请求 DeepSeek
    await actIntro();                            // 第 2 幕：斜置纸面 + 红头打字
    const result = await genPromise;             // 等待生成结果
    if (result.ok) {
      await actType(result.data);                // 第 3 幕：逐字成文
      await actSeal();                           // 第 4 幕：转正盖章
    } else {
      await actFail(result.message);             // 失败分支
    }
  } finally {
    busy = false;
    activateBtn.disabled = false;
  }
}

/* ---------- 重置 ---------- */
function reset() {
  badge.classList.remove('show');
  paper.classList.remove('reveal', 'flat');
  $('docRedhead').innerHTML = '';
  $('docNumber').textContent = '';
  $('docNumber').classList.remove('show');
  $('docRule').classList.remove('draw');
  $('docTitle').innerHTML = '';
  $('docTo').innerHTML = '';
  $('docBody').innerHTML = '';
  $('docSign').innerHTML = '';
  $('seal').classList.remove('stamp', 'bounce', 'settled');
  $('failLayer').classList.remove('show');
  $('failStamp').classList.remove('stamp');
  againBtn.classList.remove('show');
  document.body.classList.remove('shake');
  panel.classList.remove('hidden');
  input.value = '';
  input.focus();
}

activateBtn.addEventListener('click', run);
againBtn.addEventListener('click', () => { AudioFX.unlock(); AudioFX.click(); reset(); });
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) run();
});
</script>
</body>
